<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243a69"><title>역사 탐험 연구소 | 중2 역사</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#182642;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#182f59,#355ca1);color:white;padding:26px max(18px,calc((100vw - 1050px)/2))}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}h2{font-size:22px}h3{font-size:18px}main{max-width:1050px;margin:auto;padding:14px 16px 50px}button,select{cursor:pointer;font:inherit}button{background:white;border:1px solid #c8d4e7;color:#22355b;padding:10px 14px;border-radius:12px;min-height:43px}button:hover,.on{background:#dce8ff;border-color:#7e9ed1}.primary{background:#244a91;color:white;border-color:#244a91}.primary:hover{background:#183a75}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.nav button{flex:1;min-width:135px}.pane{background:white;border-radius:20px;padding:22px;margin:15px 0;box-shadow:0 6px 26px #1826420b}.muted{color:#65758f}.tiny{font-size:13px}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tile{background:#eff3fa;border:1px solid #dce5f2;border-radius:14px;padding:13px;flex:1;min-width:140px}.timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:minmax(88px,145px) 1fr;gap:12px;align-items:start}.date{background:#224b8d;color:#fff;border-radius:10px;padding:10px;text-align:center;font-weight:700}.desc{border-left:3px solid #bac9e3;padding:8px 10px;line-height:1.7}.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{background:#eef3fa;border-radius:12px;padding:13px;position:relative;line-height:1.6}.step:not(:last-child):after{content:'→';position:absolute;right:-12px;top:40%;font-weight:bold;color:#3254a0;z-index:1}.chip{display:inline-block;background:#eaf3ed;padding:6px 10px;border-radius:20px;margin:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.flash{min-height:105px;padding:14px;background:#eaf0fb;font-weight:700}.flash.flipped{background:#f2f8e9;font-weight:500}.choice{display:block;width:100%;text-align:left;margin:8px 0}.answer{padding:13px;border-radius:12px;background:#eaf4f0;margin:10px 0}.bad{background:#fff0ee}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.lesson-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px}.lesson-buttons button{text-align:left}.prose{font-size:17px;line-height:1.9}.meter{background:#e4eaf4;height:12px;border-radius:20px;overflow:hidden}.meter>div{height:100%;background:#51a77b}.hidden{display:none!important}textarea{width:100%;min-height:110px;font:inherit;border:1px solid #bfcde0;border-radius:12px;padding:14px;line-height:1.7}input[type=checkbox]{width:18px;height:18px;accent-color:#244a91}label{cursor:pointer}details{padding:10px 0;border-bottom:1px solid #edf0f5}summary{cursor:pointer;font-weight:600}.source{border-left:4px solid #d0d9e9;padding:8px 14px;background:#f7f9fd;font-size:14px}footer{text-align:center;color:#78849a;padding:22px}@media(max-width:600px){.pane{padding:16px}.chain{grid-template-columns:1fr}.step:after{display:none}.timeline-item{grid-template-columns:90px 1fr}.prose{font-size:16px}}
</style></head><body><header><h1>📘 역사 탐험 연구소</h1><div>한국사 1~4단원 연결 학습 · 조선 기말고사 8일 완성</div></header><main><nav class="nav" aria-label="학습 메뉴"><button onclick="tab('map')">🧭 연표·마인드맵</button><button onclick="tab('daily')">📅 8일 학습</button><button onclick="tab('review')">🔁 오답 복습</button><button onclick="tab('scope')">⚙️ 시험 범위</button></nav><div id="app"></div></main><footer>동아출판 역사② 교과서·지도서 기반 재구성 학습자료 · 저장 정보는 이 기기에만 보관됩니다.</footer><script src="content.js"></script><script>
const $=id=>document.getElementById(id);const key='hstudy_v2_';const get=(k,f)=>{try{return JSON.parse(localStorage.getItem(key+k))??f}catch{return f}},set=(k,v)=>localStorage.setItem(key+k,JSON.stringify(v));let scope=get('scope',[0,1,2,3,4,5,6,7]),done=get('done',{}),wrong=get('wrong',{}),view='map',day=0,quizIndex=0,quizAnswered=false,essayShown=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const chain=s=>'<div class="chain">'+s.split(' → ').map(x=>`<div class="step">${esc(x)}</div>`).join('')+'</div>';
function tab(id){view=id;render();scrollTo({top:0,behavior:'smooth'})}function render(){let a=$('app');if(view==='map')a.innerHTML=mapUI();if(view==='daily')a.innerHTML=dailyUI();if(view==='review')a.innerHTML=reviewUI();if(view==='scope')a.innerHTML=scopeUI()}
function mapUI(){return `<section class="pane"><h2>1~4단원 전체 시대 연표</h2><p class="muted">연대는 핵심 사건을 중심으로 요약했습니다. 시대가 겹치는 부분도 함께 살펴보세요.</p><div class="timeline">${periods.map(p=>`<div class="timeline-item"><div class="date">${esc(p[0])}</div><div class="desc"><b>${esc(p[1])}</b><div>${esc(p[2])}</div><span class="muted tiny">핵심: ${esc(p[3])}</span></div></div>`).join('')}</div></section><section class="pane"><h2>원인 → 과정 → 결과 마인드맵</h2><p>하나의 사건이 다음 시대를 어떻게 만들었는지 확인해 보세요.</p>${causes.map((x,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${esc(x[0])}</summary><div class="chain"><div class="step"><b>원인</b><p>${esc(x[1])}</p></div><div class="step"><b>전개</b><p>${esc(x[2])}</p></div><div class="step"><b>결과</b><p>${esc(x[3])}</p></div><div class="step"><b>다음 시대 질문</b><p>이 변화가 다음 역사에 끼친 영향은?</p></div></div></details>`).join('')}</section><section class="pane"><h2>4개 대단원 연결하기</h2>${[['Ⅰ 국가의 형성과 발전','여러 나라가 중앙 집권 국가로 성장'],['Ⅱ 통일 신라와 발해','통일·남북국 발전 이후 신라 말의 혼란'],['Ⅲ 고려의 성립과 변천','후삼국 통일과 변천, 말기의 개혁 세력 등장'],['Ⅳ 조선의 성립과 발전','성리학 중심 체제와 사림의 성장, 왜란과 호란']].map((x,i)=>`<div class="tile" style="margin:8px 0"><b>${x[0]}</b><p>${x[1]}</p>${i<3?'<span class="muted">↓ 다음 시대에 영향</span>':''}</div>`).join('')}</section>`}
function dailyUI(){if(!scope.length)return `<section class="pane"><h2>시험 범위를 먼저 설정해 주세요.</h2><button onclick="tab('scope')">범위 설정</button></section>`;if(!scope.includes(day))day=scope[0];let count=scope.filter(i=>done[i]).length;return `<section class="pane"><div class="row"><div><h2>4단원 8일 집중 학습</h2><p class="muted">소단원별 20~30분 권장 · 읽기 7분 / 흐름 5분 / 암기 5분 / 문제·서술형 8~13분</p></div><b>${count}/${scope.length} 완료</b></div><div class="meter"><div style="width:${100*count/scope.length}%"></div></div><div class="lesson-buttons" style="margin-top:14px">${scope.map(i=>`<button class="${day===i?'on':''}" onclick="openDay(${i})"><b>Day ${i+1}</b> ${esc(data[i].title)} ${done[i]?'✅':''}</button>`).join('')}</div></section>${lessonUI()}`}
function lessonUI(){const d=data[day],s=supplement[day];return `<section class="pane"><h2>Day ${day+1}. ${esc(d.title)}</h2><p class="muted">교과서 학습 주제에 따른 상세 설명</p><div class="prose">${esc(s.story)}</div><div class="source">핵심 연결: ${esc(s.point)}</div><h3>1. 사건의 흐름과 인과관계</h3>${chain(s.chain)}<h3>2. 스스로 답해 볼 세 가지 질문</h3>${s.checks.map((x,i)=>`<details><summary>${i+1}. ${esc(x)}</summary><p>위 설명과 흐름도를 다시 읽고 자신의 문장으로 대답해 보세요.</p></details>`).join('')}<h3>3. 앞면·뒷면 암기 카드 (${d.terms.length}개)</h3><p class="muted tiny">카드를 터치하면 설명이 나타나고, 다시 터치하면 용어로 돌아옵니다.</p><div class="cards">${d.terms.map((t,i)=>`<button class="flash" data-term="${day}-${i}" onclick="flip(this,${day},${i})">${esc(t[0])}</button>`).join('')}</div></section><section class="pane"><h3>4. 객관식 실력 점검</h3><div id="quizArea"></div></section><section class="pane"><h3>5. 서술형 연습</h3><p><b>${esc(s.essay)}</b></p><textarea id="essay" placeholder="원인과 결과를 연결하여 2~4문장으로 직접 써 보세요."></textarea><div class="flex" style="margin-top:10px"><button onclick="showModel()">모범 답안·채점 요소 보기</button><button onclick="saveEssay()">내 답안 저장</button></div><div id="model"></div></section><section class="pane"><h3>6. 오늘의 마무리</h3><p>설명 읽기 → 카드 확인 → 객관식 → 서술형까지 마쳤다면 완료하세요.</p><button class="primary" onclick="completeDay()">✅ Day ${day+1} 학습 완료 표시</button><span id="doneMsg" class="muted"></span></section>`}
function openDay(i){day=i;quizIndex=0;quizAnswered=false;essayShown=false;view='daily';render();renderQuiz();let t=$('essay');if(t)t.value=get('essay_'+i,'')}
function flip(b,di,ti){let t=data[di].terms[ti];let f=b.classList.toggle('flipped');b.textContent=f?t[1]:t[0]}
function renderQuiz(){let el=$('quizArea');if(!el)return;let q=data[day].q[quizIndex];if(!q){el.innerHTML='<p>문제 준비 중입니다.</p>';return;}el.innerHTML=`<p><strong>문제 ${quizIndex+1}/${data[day].q.length}</strong> · ${esc(q[0])}</p>${q[1].map((x,j)=>`<button class="choice" onclick="answer(${j})">${j+1}. ${esc(x)}</button>`).join('')}<div id="result"></div>`;quizAnswered=false}
function answer(j){if(quizAnswered)return;quizAnswered=true;let q=data[day].q[quizIndex],id=day+'-'+quizIndex,good=j===q[2];if(good)delete wrong[id];else wrong[id]=true;set('wrong',wrong);$('result').innerHTML=`<div class="answer ${good?'':'bad'}"><b>${good?'정답입니다!':'오답입니다. 정답: '+esc(q[1][q[2]])}</b><p>${esc(q[3])}</p></div><button class="primary" onclick="nextQuiz()">${quizIndex===data[day].q.length-1?'문제 풀이 마침':'다음 문제 →'}</button>`}
function nextQuiz(){quizIndex++;if(quizIndex>=data[day].q.length){$('quizArea').innerHTML='<div class="answer">객관식 확인을 마쳤습니다. 아래 서술형으로 원인과 결과를 설명해 보세요.</div><button onclick="restartQuiz()">문제 다시 풀기</button>'}else renderQuiz()}
function restartQuiz(){quizIndex=0;renderQuiz()}
function showModel(){$('model').innerHTML=`<div class="answer"><b>모범 답안 예시</b><p>${esc(supplement[day].model)}</p><p><b>채점 기준:</b> 핵심 용어 사용 / 원인-과정-결과 연결 / 역사 사실의 정확성. 표현이 달라도 근거가 타당하면 정답으로 볼 수 있습니다.</p></div>`}
function saveEssay(){set('essay_'+day,$('essay').value);$('model').innerHTML='<div class="answer">내 답안을 이 기기에 저장했습니다.</div>'}
function completeDay(){done[day]=true;set('done',done);$('doneMsg').textContent=' 완료했습니다!';setTimeout(()=>render(),350)}
function scopeUI(){return `<section class="pane"><h2>기말고사 시험 범위 조정</h2><p>선택한 소단원만 8일 학습 메뉴에 표시됩니다. 선택을 바꾸어도 이전 학습 기록은 남습니다.</p>${data.map((d,i)=>`<p><label><input type="checkbox" class="scopeitem" value="${i}" ${scope.includes(i)?'checked':''}> ${i+1}. ${esc(d.title)}</label></p>`).join('')}<button class="primary" onclick="saveScope()">선택 범위 저장하기</button></section><section class="pane"><h3>학습 기록 관리</h3><p class="muted">학습 기록은 기기별 브라우저 저장소에 남습니다. 로그인 없는 배포 방식에서는 여러 기기 사이에 자동 동기화되지 않습니다.</p><button onclick="exportProgress()">내 학습 기록 JSON 백업</button></section>`}
function saveScope(){scope=[...document.querySelectorAll('.scopeitem:checked')].map(e=>+e.value);set('scope',scope);tab('daily')}
function reviewUI(){let ids=Object.keys(wrong);return `<section class="pane"><h2>오답 복습 ${ids.length}개</h2><p>틀렸던 문항의 정답과 해설을 확인하고 다시 풀어보세요.</p>${ids.length?ids.map(id=>{let [i,j]=id.split('-').map(Number),q=data[i]?.q[j];if(!q)return '';return `<div class="tile" style="margin:10px 0"><b>${esc(data[i].title)}</b><p>${esc(q[0])}</p><p>정답: <b>${esc(q[1][q[2]])}</b></p><p>${esc(q[3])}</p><button onclick="clearWrong('${id}')">이해했어요 · 오답에서 제외</button></div>`}).join(''):'<p>저장된 오답이 없습니다. 🎉</p>'}</section>`}
function clearWrong(id){delete wrong[id];set('wrong',wrong);render()}
function exportProgress(){let o={scope,done,wrong,essays:data.map((_,i)=>get('essay_'+i,''))};let url=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='history-progress.json';a.click();URL.revokeObjectURL(url)}
render();
</script></body></html>
