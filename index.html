renderQuiz=function(){const el=$('quizArea');if(!el)return;let q=examBank[day][quizIndex];if(!q){el.innerHTML='문제를 모두 풀었습니다.';return}quiz3Choice=null;el.innerHTML='<p class="qnum">문제 '+(quizIndex+1)+'/20 · '+esc(q.question)+'</p>'+q.options.map((x,j)=>'<button class="choice" onclick="answer('+j+')">'+['①','②','③','④','⑤'][j]+' '+esc(x)+'</button>').join('')+'<div id="result"></div>'};
answer=function(j){if(quiz3Choice!==null)return;quiz3Choice=j;const q=examBank[day][quizIndex],id=day+'-'+quizIndex,good=j===q.answer;if(good){quiz3Correct++;delete wrong[id]}else wrong[id]=true;set('wrong',wrong);$('result').innerHTML='<div class="answer '+(good?'':'bad')+'"><strong>'+(good?'정답입니다!':'오답입니다. 정답: '+['①','②','③','④','⑤'][q.answer]+' '+esc(q.options[q.answer]))+'</strong><p>'+esc(q.explanation)+'</p></div><button class="primary" onclick="nextQuiz()">'+(quizIndex===19?'채점 결과 보기':'다음 문제 →')+'</button>'};
nextQuiz=function(){quizIndex++;if(quizIndex>=20){$('quizArea').innerHTML='<div class="answer"><h3>'+quiz3Correct+' / 20 정답 ('+(quiz3Correct*5)+'점)</h3><p>오답은 오답 복습 메뉴에서 확인하세요.</p></div><button onclick="restartQuiz()">20문항 다시 풀기</button>';set('topicScore_'+day,{score:quiz3Correct,total:20,date:new Date().toISOString()})}else renderQuiz()};
restartQuiz=function(){quizIndex=0;quiz3Correct=0;quiz3Choice=null;renderQuiz()};
const _openDay_V2=openDay;
openDay=function(i){quiz3Correct=0;_openDay_V2(i)};
const _reviewUI_V2=reviewUI;
reviewUI=function(){let ids=Object.keys(wrong);let output='<section class="pane"><h2>기말고사형 오답 복습 '+ids.length+'개</h2>'+ids.map(id=>{let [di,qi]=id.split('-').map(Number),q=examBank[di]?.[qi];return q?'<div class="resultcard"><b>'+esc(data[di].title)+' · '+(qi+1)+'번</b><p>'+esc(q.question)+'</p><p>정답: '+esc(q.options[q.answer])+'</p><p>'+esc(q.explanation)+'</p><button onclick="clearWrong(\''+id+'\')">이해 완료</button></div>':''}).join('')+(ids.length?'':'<p>저장된 오답이 없습니다.</p>')+'</section>';return output};
function beginExam(n){examRun=n;examSubmitted=false;examSelections={};let eligible=scope.length?scope:[0,1,2,3,4,5,6,7];let collected=[];for(let k=0;k<25;k++){let di=eligible[(k+n*3)%eligible.length];let qi=(n*7+k*3+Math.floor(k/eligible.length))%20;collected.push({di,qi,q:examBank[di][qi]})}window.currentExam=shuffleStable(collected,n*971+43);view='exam';render();scrollTo({top:0,behavior:'smooth'})}
function examUI(){if(examRun===null)return '<section class="pane"><h2>실전 모의고사 · 3회</h2><p>각 25문항, 5지선다, 100점 만점. 선택한 시험 범위에서 출제됩니다. 제출 전에는 정답을 보여주지 않습니다.</p><div class="examgrid">'+[0,1,2].map(n=>'<div class="examitem"><b>제'+(n+1)+'회 기말고사</b><p>25문항 · 100점 만점</p><button class="primary" onclick="beginExam('+n+')">시험 시작</button></div>').join('')+'</div></section><section class="pane"><h3>성적 기록</h3>'+[0,1,2].map(n=>{let r=get('exam_'+n,null);return '<p>제'+(n+1)+'회: '+(r?r.score+'점 ('+r.right+'/25 정답)':'응시 전')+'</p>'}).join('')+'</section>';
let list=window.currentExam||[],selected=Object.keys(examSelections).length;return '<section class="pane"><h2>제'+(examRun+1)+'회 실전 모의고사</h2><div class="examtoolbar"><b>'+selected+'/25 응답'+(examSubmitted?' · 제출 완료':'')+'</b> <button onclick="backExams()">목록으로</button> '+(!examSubmitted?'<button class="primary" onclick="submitExam()">답안 제출 · 자동 채점</button>':'')+'</div>'+list.map((o,i)=>'<div class="examitem" style="margin:16px 0"><p><span class="qnum">'+(i+1)+'.</span> '+esc(o.q.question)+'</p>'+o.q.options.map((v,j)=>'<button '+(examSubmitted?'disabled':'')+' class="choice '+(examSelections[i]===j?'selected':'')+'" onclick="selectExam('+i+','+j+')">'+['①','②','③','④','⑤'][j]+' '+esc(v)+'</button>').join('')+(examSubmitted?'<div class="resultcard '+(examSelections[i]===o.q.answer?'correct':'incorrect')+'"><b>정답 '+['①','②','③','④','⑤'][o.q.answer]+' '+esc(o.q.options[o.q.answer])+'</b><p>'+esc(o.q.explanation)+'</p></div>':'')+'</div>').join('')+(examSubmitted?'<div class="answer"><h2>점수 '+(window.examScore||0)+'점</h2><button onclick="backExams()">모의고사 목록</button></div>':'<button class="primary" onclick="submitExam()">답안 제출 · 자동 채점</button>')+'</section>'}
function selectExam(i,j){if(examSubmitted)return;examSelections[i]=j;render()}
function submitExam(){if(examSubmitted)return;const list=window.currentExam||[];let right=0;list.forEach((o,i)=>{if(examSelections[i]===o.q.answer)right++;else {wrong[o.di+'-'+o.qi]=true}});set('wrong',wrong);let score=right*4;window.examScore=score;set('exam_'+examRun,{score,right,date:new Date().toISOString(),answers:examSelections});examSubmitted=true;render();scrollTo({top:0,behavior:'smooth'})}
function backExams(){examRun=null;examSubmitted=false;view='exam';render()}
const _render_V2=render;
render=function(){if(view==='exam')$('app').innerHTML=examUI();else _render_V2();if(view==='daily'&&scope.length)renderQuiz()};
document.querySelector('nav.nav').insertAdjacentHTML('beforeend','<button onclick="tab(\'exam\')">📝 실전 모의고사 3회</button>');
const _dailyUI_V2=dailyUI;
dailyUI=function(){return _dailyUI_V2()};
render();
</script><script src="advanced.js"></script><script src="enhancement.js"></script><script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(e=>console.warn('Service worker:',e)))}
let installRequest=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installRequest=e;const b=document.getElementById('history-install');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{installRequest=null;const b=document.getElementById('history-install');if(b)b.hidden=true});
function installHistoryApp(){if(installRequest){const prompt=installRequest;installRequest=null;prompt.prompt()}else alert('Chrome의 오른쪽 위 ⋮ 메뉴를 누른 뒤 「앱 설치」 또는 「홈 화면에 추가」를 선택하세요.')}
document.querySelector('nav.nav').insertAdjacentHTML('beforeend','<button id="history-install" onclick="installHistoryApp()" style="border-color:#d9b15e;background:#fff8e7">📲 홈 화면에 설치</button>');
</script></body></html>
